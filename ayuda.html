<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C92A62">
<link rel="icon" href="icono-192.png">
<title>Videos de ayuda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
/* Una sola columna, letra grande y botones grandes: la lista de videos de la tienda, pensada para el celular de la dueña */
:root {
  --fondo: #F3EFF6; --tarjeta: #FFFFFF; --tinta: #26203A; --suave: #5F5874; --linea: #DDD6E8;
  --marca: #C92A62; --marca-tinta: #FFFFFF; --marca-suave: #FBE3EC;
  --letra: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #17141F; --tarjeta: #231F2F; --tinta: #F2EEF8; --suave: #B4ADC8; --linea: #3A3450;
  --marca: #FF6E9F; --marca-tinta: #1B1020; --marca-suave: #3D1E2C; color-scheme: dark; } }
:root[data-theme="dark"] {
  --fondo: #17141F; --tarjeta: #231F2F; --tinta: #F2EEF8; --suave: #B4ADC8; --linea: #3A3450;
  --marca: #FF6E9F; --marca-tinta: #1B1020; --marca-suave: #3D1E2C; color-scheme: dark; }

body { background: var(--fondo); color: var(--tinta); font-family: var(--letra); font-size: 19px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 22px; }
a, button { font: inherit; }
:focus-visible { outline: 3px solid var(--marca); outline-offset: 3px; }

.cabeza { display: flex; gap: 14px; align-items: center; }
.logo { width: 54px; height: 54px; border-radius: 15px; background: var(--marca); color: var(--marca-tinta); display: grid; place-items: center; flex: none; }
.logo svg { width: 30px; height: 30px; }
.cabeza p { margin: 0; color: var(--suave); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
h1 { margin: 2px 0 0; font-size: 30px; line-height: 1.15; text-wrap: balance; }
.intro { margin: 0; color: var(--suave); max-width: 34em; }

.aparato { display: grid; gap: 10px; }
.aparato span { font-weight: 700; }
.segmento { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--tarjeta); border: 2px solid var(--linea); border-radius: 16px; padding: 6px; }
.segmento button { appearance: none; border: 0; border-radius: 11px; min-height: 52px; background: transparent; color: var(--tinta); font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.segmento button svg { width: 22px; height: 22px; }
.segmento button[aria-pressed="true"] { background: var(--tinta); color: var(--fondo); }

ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.video { background: var(--tarjeta); border-radius: 18px; padding: 16px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.num { grid-row: span 2; width: 52px; height: 52px; border-radius: 14px; background: var(--marca-suave); color: var(--marca); display: grid; place-items: center; font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.video h2 { margin: 0; font-size: 21px; line-height: 1.25; text-wrap: balance; }
.video p { margin: 0; color: var(--suave); font-size: 16px; }
.ver { grid-column: 1 / -1; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border-radius: 14px; background: var(--marca); color: var(--marca-tinta); text-decoration: none; font-weight: 700; font-size: 19px; }
.ver svg { width: 24px; height: 24px; flex: none; }
.ver span small { font-weight: 400; opacity: .9; font-size: 15px; }

.volver { display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 14px; border: 2px solid var(--linea); background: var(--tarjeta); color: var(--tinta); text-decoration: none; font-weight: 700; }
.nota { margin: 0; color: var(--suave); font-size: 15px; }
@media (prefers-reduced-motion: no-preference) { .ver { transition: transform .12s; } .ver:active { transform: scale(.98); } }
</style>

</head>
<body>
<main>
  <header class="cabeza">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="8" cy="8" r="1.5"/></svg></span>
    <div><p>Lalys glamour</p><h1>Videos de ayuda</h1></div>
  </header>
  <p class="intro">Un video corto para cada parte de la tienda. Toque el que necesite: se abre y se escucha la explicación paso a paso.</p>

  <div class="aparato">
    <span id="etqAparato">¿Desde dónde los va a ver?</span>
    <div class="segmento" role="group" aria-labelledby="etqAparato">
      <button type="button" id="bCelular" data-aparato="celular" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Celular</button>
      <button type="button" id="bTableta" data-aparato="tableta" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2"/><path d="M11 18.5h2"/></svg>Tableta</button>
    </div>
  </div>

  <ol id="lista"></ol>

  <a class="volver" href="./">Volver a la tienda</a>
  <p class="nota">Los videos usan una tienda de ejemplo: los nombres, prendas y montos no son los de verdad.</p>
</main>

<script>
const BASE = 'videos/';   // en el mismo sitio de la tienda
const VIDEOS = [
  ['01-la-pantalla-de-inicio', 'La pantalla de inicio', 'Qué es cada cosa, el ojito y cómo volver al inicio', '1:45'],
  ['02-agregar-prendas-nuevas', 'Agregar prendas nuevas', 'Foto, precio, talla, color y etiqueta', '2:22'],
  ['03-vender', 'Vender', 'Pasar las prendas, cobrar y guardar la venta', '1:49'],
  ['04-buscar-prendas-y-cambiar-el-precio', 'Buscar prendas y cambiar el precio', 'Encontrar una prenda y corregir sus datos', '1:34'],
  ['05-poner-prendas-en-oferta', 'Poner prendas en oferta', 'Descuento con el precio de antes tachado', '1:35'],
  ['06-hacer-un-pedido', 'Hacer un pedido', 'Cuando una clienta aparta prendas', '2:01'],
  ['07-anotar-abonos-y-entregar-un-pedido', 'Abonos y entregar un pedido', 'Anotar pagos y entregar las prendas', '2:13'],
  ['08-anotar-una-compra', 'Anotar una compra', 'Una paca y cuánto le costó cada prenda', '1:38'],
  ['09-clientes', 'Clientes', 'Agregarlas y ver lo que le han comprado', '1:08'],
  ['10-imprimir-etiquetas', 'Imprimir etiquetas', 'Con la impresora por Bluetooth', '1:33'],
  ['11-ajustes', 'Ajustes', 'Nombre, teléfono, etiquetas y más', '1:04'],
];
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l11-6.5a1 1 0 0 0 0-1.74l-11-6.5A1 1 0 0 0 8 5.5z"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let aparato = 'celular';
try { aparato = localStorage.getItem('ayuda:aparato') === 'tableta' ? 'tableta' : 'celular'; } catch (e) { /* sin memoria */ }
function pintar() {
  for (const b of document.querySelectorAll('[data-aparato]')) b.setAttribute('aria-pressed', String(b.dataset.aparato === aparato));
  document.getElementById('lista').innerHTML = VIDEOS.map(([archivo, titulo, sub, dura], i) => `
    <li class="video">
      <span class="num" aria-hidden="true">${i + 1}</span>
      <h2>${esc(titulo)}</h2>
      <p>${esc(sub)} · ${dura} min</p>
      <a class="ver" href="${BASE}${aparato}/${archivo}.mp4">${PLAY}<span>Ver el video <small>(${aparato})</small></span></a>
    </li>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-aparato]');
  if (!b) return;
  aparato = b.dataset.aparato;
  try { localStorage.setItem('ayuda:aparato', aparato); } catch (e) { /* sin memoria */ }
  pintar();
});
pintar();
</script>

</body>
</html>
