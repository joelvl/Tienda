<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi tienda: inventario y ventas</title>
<!--MI_TIENDA_CONFIG-->
<script>try{var t=localStorage.getItem('mitienda:tema');document.documentElement.setAttribute('data-theme',t==='oscuro'?'dark':'light');}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --fondo:#EFEDF6; --superficie:#FFFFFF; --superficie-2:#F6F5FA; --tinta:#221F3B; --tinta-suave:#5B5775; --linea:#D8D4E6;
  --marca:#C92A62; --marca-tinta:#FFFFFF; --marca-suave:#FBE4ED;
  --gana:#0A7A52; --gana-tinta:#FFFFFF; --gana-suave:#DDF2E8;
  --pierde:#B42318; --pierde-suave:#FDE7E3;
  --aviso:#9A5B00; --aviso-suave:#FFF0D1;
  --foco:#2F54EB;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --fondo:#15131D; --superficie:#221F2D; --superficie-2:#2B2839; --tinta:#F2F0F9; --tinta-suave:#B0ABC6; --linea:#3A3650;
    --marca:#FF6B9C; --marca-tinta:#1B1020; --marca-suave:#3B1D2B;
    --gana:#48D597; --gana-tinta:#0B1F16; --gana-suave:#15342A;
    --pierde:#FF8E7E; --pierde-suave:#3D1C18;
    --aviso:#F4BE5C; --aviso-suave:#352A12;
    --foco:#8EA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fondo:#15131D; --superficie:#221F2D; --superficie-2:#2B2839; --tinta:#F2F0F9; --tinta-suave:#B0ABC6; --linea:#3A3650;
  --marca:#FF6B9C; --marca-tinta:#1B1020; --marca-suave:#3B1D2B;
  --gana:#48D597; --gana-tinta:#0B1F16; --gana-suave:#15342A;
  --pierde:#FF8E7E; --pierde-suave:#3D1C18;
  --aviso:#F4BE5C; --aviso-suave:#352A12;
  --foco:#8EA8FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:"Atkinson Hyperlegible","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:18px;line-height:1.45}
body.con-hoja{overflow:hidden}
[hidden]{display:none!important}
img{max-width:100%}
h1{font-size:30px;line-height:1.15;margin:8px 0 16px;letter-spacing:-.01em}
h2{font-size:22px;line-height:1.2;margin:30px 0 12px}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 10px}
b,strong{font-weight:700}
.app{max-width:1080px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
.angosto{max-width:680px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 4px}
.marca-tienda{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;min-width:0}
.marca-tienda #nombreTienda{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:38px;height:38px;border-radius:11px;background:var(--marca);color:var(--marca-tinta);display:grid;place-items:center;flex:none}
.logo svg{width:22px;height:22px}
.btn-ajustes{appearance:none;border:0;background:none;color:var(--tinta-suave);font:inherit;font-size:16px;display:flex;align-items:center;gap:6px;min-height:48px;padding:0 10px;border-radius:12px;cursor:pointer}
.ico{width:24px;height:24px;flex:none}

/* navegación */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--superficie);border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{position:relative;appearance:none;border:0;background:none;color:var(--tinta-suave);font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px;padding:8px 2px;cursor:pointer}
.tab .ico{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--marca);font-weight:700}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:var(--marca)}
@media (min-width:900px){
  .tabs{top:0;right:auto;width:210px;grid-template-columns:none;grid-auto-rows:min-content;align-content:start;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 84px) 12px 12px;border-top:0;border-right:1px solid var(--linea)}
  .tab{flex-direction:row;justify-content:flex-start;gap:14px;font-size:18px;min-height:56px;padding:0 16px;border-radius:12px}
  .tab[aria-current="page"]{background:var(--marca-suave)}
  .tab[aria-current="page"]::before{display:none}
  .app{margin-left:210px;padding:0 40px 60px}
}

/* botones y campos */
.btn{appearance:none;font:inherit;font-weight:700;font-size:19px;line-height:1.2;min-height:56px;padding:12px 20px;border-radius:14px;border:2px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-align:center;text-decoration:none;position:relative}
.btn-marca{background:var(--marca);color:var(--marca-tinta)}
.btn-gana{background:var(--gana);color:var(--gana-tinta)}
.btn-sec{background:var(--superficie);color:var(--tinta);border-color:var(--linea)}
.btn-peligro{background:transparent;color:var(--pierde);border-color:var(--pierde)}
.btn-enorme{width:100%;min-height:66px;font-size:21px}
.btn:disabled{opacity:.55;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
label.btn:focus-within{outline:3px solid var(--foco);outline-offset:2px}
.oculto{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.campo{margin:16px 0}
.campo>label,.campo>.etq{display:block;font-weight:700;margin-bottom:6px}
input,select{font:inherit;font-size:20px;width:100%;min-height:56px;padding:10px 14px;border:2px solid var(--linea);border-radius:12px;background:var(--superficie);color:var(--tinta)}
input::placeholder{color:var(--tinta-suave);opacity:.85}
input:focus,select:focus{border-color:var(--foco)}
.dinero{position:relative}
.dinero::before{content:"₡";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-weight:700;pointer-events:none;font-size:20px}
.dinero input{padding-left:38px;font-weight:700}
.dinero.grande input{font-size:30px;min-height:68px;text-align:center}
.dinero.grande::before{font-size:26px}
.stepper{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;align-items:stretch}
.cuadrado{min-height:68px;padding:0;font-size:32px}
.nota{font-size:16px;color:var(--tinta-suave)}
.intro{color:var(--tinta-suave);max-width:60ch}
.mt{margin-top:10px}
.mb{margin-bottom:14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dos .campo{margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;font:inherit;font-size:18px;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--linea);background:var(--superficie);color:var(--tinta);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--superficie);font-weight:700}
.segmento{display:grid;grid-template-columns:repeat(3,1fr);background:var(--superficie);border:2px solid var(--linea);border-radius:14px;padding:4px;gap:4px}
.segmento button{appearance:none;border:0;background:none;font:inherit;font-size:17px;color:var(--tinta);min-height:50px;border-radius:10px;cursor:pointer;padding:4px}
.segmento button[aria-pressed="true"]{background:var(--tinta);color:var(--superficie);font-weight:700}
.verde{color:var(--gana)} .rojo{color:var(--pierde)}

/* agregar */
.paso{background:var(--superficie);border-radius:18px;padding:18px;margin:16px 0}
.paso>h2{margin:0 0 14px;display:flex;align-items:center;gap:12px}
.num{width:36px;height:36px;border-radius:50%;background:var(--marca-suave);color:var(--marca);display:grid;place-items:center;font-size:19px;flex:none}
.foto-zona{border-radius:14px;overflow:hidden;background:var(--superficie-2);aspect-ratio:4/3;max-height:340px;width:100%;display:grid;place-items:center;margin-bottom:12px}
.foto-zona img{width:100%;height:100%;object-fit:contain}
.foto-vacia{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tinta-suave)}
.foto-vacia .ico{width:48px;height:48px}
.dos-botones{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.ia{margin:12px 0 0;font-size:17px;display:flex;align-items:center;gap:10px}
.ia .ico{color:var(--gana)}
.girando{width:22px;height:22px;border-radius:50%;border:3px solid var(--linea);border-top-color:var(--marca);animation:gira .9s linear infinite;flex:none;display:inline-block}
@keyframes gira{to{transform:rotate(360deg)}}
.resultado{font-size:19px;font-weight:700;margin:12px 0 0}
.etq-vivo{margin-top:18px}
.etq-vivo .etq{display:block;font-weight:700}
.etq-vivo .vista-etiqueta{margin:8px 0 0}

.cargando{display:flex;align-items:center;gap:12px;padding:40px 0;color:var(--tinta-suave)}

/* hoy: el tiquete de caja */
.saludo{color:var(--tinta-suave);margin:14px 0 0}
.ticket{--z:9px;background:var(--superficie);border-radius:16px 16px 0 0;padding:20px 22px calc(22px + var(--z));margin:4px 0 22px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--z)) 100%;
  mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/calc(2*var(--z)) 100%}
.ticket .fila{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.ticket .fila>span{font-size:19px}
.ticket .fila strong{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.ticket .fila strong.med{font-size:26px}
.ticket hr{border:0;border-top:2px dashed var(--linea);margin:14px 0}
.ticket .sub{color:var(--tinta-suave);font-size:16px;margin:4px 0 0}
.periodos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--superficie);border-radius:16px;padding:14px 16px}
.panel p{margin:2px 0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0 6px}
.dias{background:var(--superficie);border-radius:18px;padding:6px 16px}
.dia-fila{display:grid;grid-template-columns:minmax(96px,auto) 1fr minmax(84px,auto);gap:12px;align-items:center;min-height:46px;border-bottom:1px solid var(--linea)}
.dia-fila:last-child{border-bottom:0}
.dia-fila b{text-align:right;font-variant-numeric:tabular-nums}
.pista{height:14px;background:var(--superficie-2);border-radius:7px;overflow:hidden;display:block}
.pista span{display:block;height:100%;background:var(--gana);border-radius:7px}
.pasos-inicio{padding-left:0;list-style:none;counter-reset:p;margin:16px 0 22px}
.pasos-inicio li{counter-increment:p;display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--superficie);border-radius:16px;padding:14px 16px;margin:10px 0}
.pasos-inicio li::before{content:counter(p);width:36px;height:36px;border-radius:50%;background:var(--marca-suave);color:var(--marca);display:grid;place-items:center;font-weight:700}

/* etiquetas colgantes (tarjetas de prendas) */
.grid-tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.tag{position:relative;appearance:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;background:var(--superficie);
  clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%,0 22px);
  padding:30px 12px 14px;display:flex;flex-direction:column;gap:4px}
.tag::before{content:"";position:absolute;top:9px;left:50%;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:var(--fondo);box-shadow:inset 0 0 0 2px var(--linea)}
.tag:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--foco)}
.tag img,.tag .sin-foto{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--superficie-2);display:grid;place-items:center;color:var(--tinta-suave);margin-bottom:6px}
.tag .sin-foto .ico{width:44px;height:44px}
.tag .precio{font-size:26px;font-weight:700;line-height:1.1}
.tag .nombre{font-size:17px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag .meta{font-size:15px;color:var(--tinta-suave)}
.tag .meta.alerta{color:var(--aviso);font-weight:700}
.tag .meta.verde{color:var(--gana)}
.tag .meta.rojo{color:var(--pierde)}
.tag.vendida .precio{color:var(--gana)}
.sello{position:absolute;top:40px;right:18px;background:var(--gana);color:var(--gana-tinta);font-weight:700;font-size:14px;padding:4px 10px;border-radius:6px;transform:rotate(4deg)}

/* compras */
.compra{appearance:none;border:0;font:inherit;color:inherit;text-align:left;width:100%;display:block;background:var(--superficie);border-radius:18px;padding:16px 18px;margin:12px 0;cursor:pointer}
.compra>span,.compra-prog>span{display:block}
.compra .t{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:20px;margin-bottom:4px}
.compra .t small{font-weight:400;color:var(--tinta-suave);font-size:16px;white-space:nowrap}
.prog{height:16px;background:var(--superficie-2);border-radius:8px;overflow:hidden;margin:10px 0 8px;display:block}
.prog span{display:block;height:100%;background:var(--gana)}
.prog.falta span{background:var(--marca)}

/* avisos */
.aviso{background:var(--aviso-suave);border-left:6px solid var(--aviso);border-radius:12px;padding:14px 16px;margin:16px 0}
.aviso p:last-child{margin-bottom:0}
.aviso .btn{margin-top:8px}
.aviso-marca{background:var(--marca-suave);border-left-color:var(--marca)}
.vacio{background:var(--superficie);border-radius:18px;padding:24px;text-align:center;color:var(--tinta-suave)}
.vacio .btn{margin-top:10px}

/* tabla */
.tabla-wrap{overflow-x:auto;background:var(--superficie);border-radius:18px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--linea);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:15px;color:var(--tinta-suave)}
.n{text-align:right;font-variant-numeric:tabular-nums}

/* ventas */
.fila-vendida{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:var(--superficie);border-radius:14px;padding:10px 12px;margin:8px 0}
.fila-vendida img,.fila-vendida .sin-foto{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--superficie-2);display:grid;place-items:center;color:var(--tinta-suave)}
.fila-vendida .btn{min-height:48px;font-size:16px;padding:8px 12px}
.calc{border-radius:16px;padding:16px 18px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:20px;flex-wrap:wrap}
.calc strong{font-size:36px;line-height:1.1}
.calc.gana{background:var(--gana-suave)} .calc.gana strong{color:var(--gana)}
.calc.pierde{background:var(--pierde-suave)} .calc.pierde strong{color:var(--pierde)}
.calc.neutro{background:var(--superficie)}

/* hoja (ventana desde abajo) */
.velo{position:fixed;inset:0;background:rgba(15,12,30,.5);z-index:40}
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--fondo);border-radius:24px 24px 0 0;max-height:92%;overflow:auto;padding:8px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:sube .2s ease-out;overscroll-behavior:contain}
.hoja:focus{outline:none}
.hoja-cab{position:sticky;top:-8px;display:flex;justify-content:flex-end;padding-top:6px;background:var(--fondo);z-index:2}
.cerrar{appearance:none;border:0;background:var(--superficie);color:var(--tinta);font:inherit;font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border-radius:999px;cursor:pointer}
.cerrar .ico{width:20px;height:20px}
.hoja h2:first-child,.sin-margen{margin-top:4px}
@keyframes sube{from{transform:translateY(30px)}to{transform:none}}
@media (min-width:700px){.hoja{left:50%;right:auto;bottom:auto;top:50%;width:min(660px,92vw);transform:translate(-50%,-50%);border-radius:24px;max-height:88%;animation:none;padding-bottom:24px}}
.botones-hoja{display:grid;gap:10px;margin-top:18px}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.cifras div{background:var(--superficie);border-radius:12px;padding:10px 14px}
.cifras dt{font-size:15px;color:var(--tinta-suave)}
.cifras dd{margin:0;font-size:24px;font-weight:700}
/* ---------- clientes ---------- */
.fila-cliente{appearance:none;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--tinta);background:var(--superficie);border:2px solid transparent;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer}
.fila-cliente b{font-size:19px;overflow-wrap:anywhere}
.fila-cliente .fc-total{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.fila-cliente .nota{grid-column:1/-1}
.venta-cliente{background:var(--superficie);border-radius:14px;padding:12px 14px;margin:10px 0}
.venta-cliente .vc-cab{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-bottom:6px}
.venta-cliente ul{margin:0;padding-left:20px}
.tels-contacto{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.detalle-foto{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:14px;background:var(--superficie-2);margin-bottom:12px}
.codigo{font-size:15px;color:var(--tinta-suave);margin:0}
.venta-cab{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.venta-cab img,.venta-cab .sin-foto{width:96px;height:96px;object-fit:cover;border-radius:12px;background:var(--superficie-2);display:grid;place-items:center;color:var(--tinta-suave)}
.venta-cab h2{margin:2px 0 4px}
.etq-grande{font-size:21px;font-weight:700;display:block;margin-bottom:8px}
.exito{text-align:center;padding:4px 0 6px}
.exito .ico{width:60px;height:60px;color:var(--gana)}
.exito h2{margin:6px 0}
.vista-etiqueta{display:block;width:100%;max-width:340px;margin:14px auto;border:1px solid var(--linea);border-radius:6px;background:#fff}
.prev-etiquetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.prev-etiquetas img{width:100%;border:1px solid var(--linea);border-radius:6px;background:#fff;display:block}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--tinta);color:var(--superficie);padding:14px 20px;border-radius:14px;font-weight:700;width:max-content;max-width:min(92vw,520px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:18px}
.toast.bien{background:var(--gana);color:var(--gana-tinta)}
.toast.mal{background:var(--pierde);color:#fff}
@media (min-width:900px){.toast{bottom:28px;margin-left:105px}}
@media (max-width:440px){
  .ticket .fila strong{font-size:34px}
  .dia-fila{grid-template-columns:minmax(80px,auto) 1fr auto;font-size:16px}
}
@media (max-width:360px){.periodos,.dos{grid-template-columns:1fr}}

class NubeBackend {
  constructor(db) { this.db = db; this.p = { disp: null, vend: null, comp: null, tien: null, clie: null, conf: null }; }
  start() {
    const err = e => { console.warn('db', e); toast('Se perdió la conexión con sus datos. Recargue la página.', 'mal'); };
    const lista = s => s.docs.map(d => ({ ...d.data(), id: d.id }));
    const pr = this.db.collection('prendas');
    pr.where('estado', '==', 'disponible').limit(1000).onSnapshot(s => { this.p.disp = lista(s); this.emitir(); }, err);
    pr.where('estado', '==', 'vendida').orderBy('fechaVenta', 'desc').limit(1000).onSnapshot(s => { this.p.vend = lista(s); this.emitir(); }, err);
    this.db.collection('compras').orderBy('fecha', 'desc').limit(500).onSnapshot(s => { this.p.comp = lista(s); this.emitir(); }, err);
    this.db.collection('tiendas').orderBy('creada', 'desc').limit(300).onSnapshot(s => { this.p.tien = lista(s); this.emitir(); }, err);
    this.db.collection('clientes').orderBy('nombre').limit(2000).onSnapshot(s => { this.p.clie = s.docs.map(d => ({ ...d.data(), telefono: d.id })); this.emitir(); }, err);
    this.db.doc('config/tienda').onSnapshot(s => { this.p.conf = s.exists ? { ...s.data() } : {}; this.emitir(); }, err);
  }
  emitir() {
    const p = this.p;
    S.prendas = [...(p.disp || []), ...(p.vend || [])];
    S.compras = p.comp || [];
    S.tiendas = p.tien || [];
    S.clientes = p.clie || [];
    S.config = { ...CONFIG_BASE, ...(p.conf || {}) };
    S.listo = p.disp !== null && p.vend !== null && p.comp !== null && p.tien !== null && p.clie !== null && p.conf !== null;
    alCambiarDatos();
  }
  ponerPrenda(x) { const { id, ...d } = tomar(x, CAMPOS_PRENDA); return this.db.collection('prendas').doc(id).set(clon(d)); }
  actualizarPrenda(id, c) { return this.db.doc('prendas/' + id).update(clon(c)); }
  quitarPrenda(id) { return this.db.doc('prendas/' + id).delete(); }
  ponerCompra(x) { const { id, ...d } = tomar(x, CAMPOS_COMPRA); return this.db.collection('compras').doc(id).set(clon(d)); }
  quitarCompra(id) { return this.db.doc('compras/' + id).delete(); }
  ponerTienda(x) { const { id, ...d } = tomar(x, CAMPOS_TIENDA); return this.db.collection('tiendas').doc(id).set(clon(d)); }
  quitarTienda(id) { return this.db.doc('tiendas/' + id).delete(); }
  ponerCliente(x) { const { telefono, ...d } = tomar(x, CAMPOS_CLIENTE); return this.db.collection('clientes').doc(telefono).set(clon(d)); }
  quitarCliente(tel) { return this.db.doc('clientes/' + tel).delete(); }
  ponerConfig(c) { return this.db.doc('config/tienda').set(clon(tomar(c, CAMPOS_CONFIG))); }
  async importar(d, avance) {
    const todo = [...(d.tiendas || []).map(t => ['t', t]), ...(d.clientes || []).map(x => ['k', x]), ...d.compras.map(c => ['c', c]), ...d.prendas.map(p => ['p', p])];
    for (let i = 0; i < todo.length; i++) {
      const [t, x] = todo[i];
      for (let intento = 0; ; intento++) {
        try { await (t === 't' ? this.ponerTienda(x) : t === 'k' ? this.ponerCliente(x) : t === 'c' ? this.ponerCompra(x) : this.ponerPrenda(x)); break; }
        catch (e) { if (intento < 4 && e && (e.code === 'resource_exhausted' || e.code === 'unavailable')) { await espera(1500 * (intento + 1)); continue; } throw e; }
      }
      avance(i + 1, todo.length);
      await espera(25);
    }
  }
}

class LocalBackend {
  constructor() {
    this.k = 'mitienda:v1';
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.k)); } catch (e) { d = null; }
    this.d = d && typeof d === 'object' ? d : { prendas: {}, compras: {}, config: {} };
    if (!this.d.tiendas) this.d.tiendas = {};
    if (!this.d.clientes) this.d.clientes = {};
  }
  start() { this.emitir(); }
  emitir() {
    S.prendas = Object.values(this.d.prendas).map(x => ({ ...x }));
    S.compras = Object.values(this.d.compras).map(x => ({ ...x })).sort((a, b) => b.fecha - a.fecha);
    S.tiendas = Object.values(this.d.tiendas).map(x => ({ ...x })).sort((a, b) => b.creada - a.creada);
    S.clientes = Object.values(this.d.clientes).map(x => ({ ...x }));
    S.config = { ...CONFIG_BASE, ...this.d.config };
    S.listo = true;
    alCambiarDatos();
  }
  guardar() {
    try { localStorage.setItem(this.k, JSON.stringify(this.d)); }
    catch (e) { toast('Este navegador ya no tiene espacio para más fotos.', 'mal'); }
    this.emitir();
  }
  async ponerPrenda(x) { this.d.prendas[x.id] = clon(tomar(x, CAMPOS_PRENDA)); this.guardar(); }
  async actualizarPrenda(id, c) { if (!this.d.prendas[id]) throw { code: 'invalid_argument' }; Object.assign(this.d.prendas[id], clon(c)); this.guardar(); }
  async quitarPrenda(id) { delete this.d.prendas[id]; this.guardar(); }
  async ponerCompra(x) { this.d.compras[x.id] = clon(tomar(x, CAMPOS_COMPRA)); this.guardar(); }
  async quitarCompra(id) { delete this.d.compras[id]; for (const p of Object.values(this.d.prendas)) if (p.compraId === id) p.compraId = ''; this.guardar(); }
  async ponerTienda(x) { this.d.tiendas[x.id] = clon(tomar(x, CAMPOS_TIENDA)); this.guardar(); }
  async quitarTienda(id) { delete this.d.tiendas[id]; for (const c of Object.values(this.d.compras)) if (c.tiendaId === id) c.tiendaId = ''; this.guardar(); }
  async ponerCliente(x) { this.d.clientes[x.telefono] = clon(tomar(x, CAMPOS_CLIENTE)); this.guardar(); }
  async quitarCliente(tel) { delete this.d.clientes[tel]; for (const p of Object.values(this.d.prendas)) if (p.clienteTel === tel) p.clienteTel = ''; this.guardar(); }
  async ponerConfig(c) { this.d.config = clon(tomar(c, CAMPOS_CONFIG)); this.guardar(); }
  async importar(d, avance) {
    for (const t of d.tiendas || []) this.d.tiendas[t.id] = clon(tomar(t, CAMPOS_TIENDA));
    for (const x of d.clientes || []) this.d.clientes[x.telefono] = clon(tomar(x, CAMPOS_CLIENTE));
    for (const c of d.compras) this.d.compras[c.id] = clon(tomar(c, CAMPOS_COMPRA));
    for (const p of d.prendas) this.d.prendas[p.id] = clon(tomar(p, CAMPOS_PRENDA));
    avance(1, 1); this.guardar();
  }
}

    this.ti = new Map(t.map(r => [r.id, deFila(r)]));
    this.cl = new Map(k.map(r => [r.telefono, deFila(r)]));
    this.cfg = cf && cf.data ? deFila(cf.data) : {};
    this.ultimaCarga = Date.now();
    this.emitir();
  }
  cambio(t, x) {
    const llave = t === 'cl' ? 'telefono' : 'id';
    if (t === 'cfg') { if (x.new && x.new.id) this.cfg = deFila(x.new); }
    else if (x.eventType === 'DELETE') { if (x.old && x.old[llave]) this[t].delete(x.old[llave]); }
    else if (x.new && x.new[llave]) this[t].set(x.new[llave], deFila(x.new));
    this.emitir();
  }
  emitir() {
    S.prendas = [...this.pr.values()];
    S.compras = [...this.co.values()].sort((a, b) => b.fecha - a.fecha);
    S.tiendas = [...this.ti.values()].sort((a, b) => b.creada - a.creada);
    S.clientes = [...this.cl.values()];
    S.config = { ...CONFIG_BASE, ...tomar(this.cfg, CAMPOS_CONFIG) };
    S.listo = true;
    alCambiarDatos();
  }
  async ok(q) {
    const r = await q;
    const { error } = r;
    if (error) throw { code: error.code === '23505' ? 'duplicado' : error.code === '42501' ? 'invalid_argument' : 'supa', message: error.message };
    return r;
  }
  // Si la base de datos no deja borrar, Supabase no da error: solo no borra nada. Por eso se revisa.
  async borrar(tabla, llave, valor) {
    const { data } = await this.ok(this.sb.from(tabla).delete().eq(llave, valor).select(llave));
    if (!data || !data.length) throw { code: 'sin_borrar', message: `no se borró ${tabla}/${valor}` };
  }
  async ponerPrenda(p) { await this.ok(this.sb.from('prendas').upsert(aFila(p, CAMPOS_PRENDA))); this.pr.set(p.id, { ...p }); this.emitir(); }
  async actualizarPrenda(id, c) { await this.ok(this.sb.from('prendas').update(aFila(c, CAMPOS_PRENDA)).eq('id', id)); const v = this.pr.get(id); if (v) this.pr.set(id, { ...v, ...c }); this.emitir(); }
  async quitarPrenda(id) { await this.borrar('prendas', 'id', id); this.pr.delete(id); this.emitir(); }
  async ponerCompra(c) { await this.ok(this.sb.from('compras').upsert(aFila(c, CAMPOS_COMPRA))); this.co.set(c.id, { ...c }); this.emitir(); }
  async quitarCompra(id) { await this.borrar('compras', 'id', id); this.co.delete(id); for (const [k, p] of this.pr) if (p.compraId === id) this.pr.set(k, { ...p, compraId: null }); this.emitir(); }
  async ponerTienda(t) { await this.ok(this.sb.from('tiendas').upsert(aFila(t, CAMPOS_TIENDA))); this.ti.set(t.id, { ...t }); this.emitir(); }
  async quitarTienda(id) { await this.borrar('tiendas', 'id', id); this.ti.delete(id); for (const [k, c] of this.co) if (c.tiendaId === id) this.co.set(k, { ...c, tiendaId: null }); this.emitir(); }
  async ponerCliente(x) { await this.ok(this.sb.from('clientes').upsert(aFila(x, CAMPOS_CLIENTE))); this.cl.set(x.telefono, { ...x }); this.emitir(); }
  async quitarCliente(tel) { await this.borrar('clientes', 'telefono', tel); this.cl.delete(tel); for (const [k, p] of this.pr) if (p.clienteTel === tel) this.pr.set(k, { ...p, clienteTel: null }); this.emitir(); }
  async ponerConfig(c) { await this.ok(this.sb.from('config').upsert({ id: 'tienda', ...aFila(c, CAMPOS_CONFIG) })); this.cfg = { ...c }; this.emitir(); }
  async siguienteCodigo() {
    const { data, error } = await this.sb.rpc('siguiente_codigo');
    if (error || !data) throw { code: 'supa', message: error ? error.message : 'sin código' };
    return String(data);
  }
  async importar(d, avance) {
    const tiendas = d.tiendas || [], clientes = d.clientes || [];
    const total = tiendas.length + clientes.length + d.compras.length + d.prendas.length;
    let hechos = 0;
    if (tiendas.length) { await this.ok(this.sb.from('tiendas').upsert(tiendas.map(t => aFila(t, CAMPOS_TIENDA)))); hechos += tiendas.length; avance(hechos, total); }
    if (clientes.length) { await this.ok(this.sb.from('clientes').upsert(clientes.map(x => aFila(x, CAMPOS_CLIENTE)))); hechos += clientes.length; avance(hechos, total); }
    for (let i = 0; i < d.compras.length; i += 200) {
      const lote = d.compras.slice(i, i + 200);
      await this.ok(this.sb.from('compras').upsert(lote.map(c => aFila(c, CAMPOS_COMPRA))));
      hechos += lote.length; avance(hechos, total);
    }
    for (let i = 0; i < d.prendas.length; i += 100) {
      const lote = d.prendas.slice(i, i + 100);
      await this.ok(this.sb.from('prendas').upsert(lote.map(p => aFila(p, CAMPOS_PRENDA))));
      hechos += lote.length; avance(hechos, total);
    }
    await this.cargarTodo();
  }
}

async function escribir(fn) {
  if (S.soloLectura) { toast('Solo puede ver esta tienda. Pida permiso de edición para hacer cambios.', 'mal'); return false; }
  for (let intento = 0; intento < 2; intento++) {
    try { await fn(); return true; }
    catch (e) {
      const c = e && e.code;
      console.warn('No se pudo guardar', e);
      if (c === 'unavailable' && intento === 0) { await espera(600 + Math.random() * 600); continue; }
      toast(
        c === 'quota_exceeded' ? 'Se llenó el espacio de la tienda. Borre prendas vendidas viejas para seguir.' :
        c === 'resource_exhausted' ? 'Demasiados cambios seguidos. Espere unos segundos y vuelva a intentar.' :
        c === 'invalid_argument' ? 'No se pudo guardar. Puede que no tenga permiso para hacer cambios.' :
        c === 'duplicado' ? 'Ese código ya existe. Vuelva a intentar.' :
        c === 'sin_borrar' ? 'No se pudo borrar: la base de datos no dio permiso. Avise a quien administra la tienda.' :
        'No se pudo guardar. Revise el internet y vuelva a intentar.', 'mal');
      return false;
    }
  }
  return false;
}

/* ================= CÁLCULOS ================= */
const compraPorId = id => id ? S.compras.find(c => c.id === id) : undefined;
const tiendaPorId = id => id ? S.tiendas.find(t => t.id === id) : undefined;
const tiendaDeCompra = c => c ? tiendaPorId(c.tiendaId) : undefined;
let cuentasMemo = null, cuentasRef = null;
function cuentaCompra(id) {
  if (cuentasRef !== S.prendas) {
    cuentasMemo = {};
    for (const p of S.prendas) if (p.compraId) cuentasMemo[p.compraId] = (cuentasMemo[p.compraId] || 0) + 1;
    cuentasRef = S.prendas;
  }
  return cuentasMemo[id] || 0;
}
// Si la compra dice cuántas prendas trae, se reparte entre esa cantidad;
// si no, se reparte entre las prendas que se han registrado de esa compra.
const costoUnidad = c => { if (!c) return 0; const n = c.cantidad > 0 ? c.cantidad : Math.max(1, cuentaCompra(c.id)); return Math.round((Number(c.costo) || 0) / n); };
const costoDe = p => { if (p.costoFijo) return Number(p.costo) || 0; const c = compraPorId(p.compraId); return c ? costoUnidad(c) : (Number(p.costo) || 0); };
const precioBase = costo => costo > 0 ? a900(costo * (Number(S.config.factor) || 2.5)) : 0;
const disponibles = () => S.prendas.filter(p => p.estado === 'disponible');
const vendidas = () => S.prendas.filter(p => p.estado === 'vendida');
const ganancia = p => (Number(p.precioVenta) || 0) - costoDe(p);
const buscar = id => S.prendas.find(p => p.id === id) || (ultimaGuardada && ultimaGuardada.id === id ? ultimaGuardada : null);
const tamanoEtiqueta = () => TAMANOS[S.config.etiqueta] || TAMANOS['50x30'];

function statsCompra(c) {
  const ps = S.prendas.filter(p => p.compraId === c.id);
  const vs = ps.filter(p => p.estado === 'vendida');
  const enTienda = ps.filter(p => p.estado === 'disponible');
  const recuperado = suma(vs, p => p.precioVenta);
  return {
    registradas: ps.length, vendidas: vs.length, recuperado,
    balance: recuperado - (Number(c.costo) || 0),
    valorTienda: suma(enTienda, p => p.precio), enTienda,
    pendientes: enTienda.filter(p => !p.impresa),
  };
}
// Una prenda tiene costo final si se escribió a mano o si su compra ya está cerrada
// (se sabe cuántas prendas trae). Mientras la compra está abierta, el costo es provisional.
function costoFinal(p) { if (p.costoFijo) return true; const c = compraPorId(p.compraId); return !c || c.cantidad > 0; }
const compraAbierta = c => !!c && !(c.cantidad > 0);
// Rentabilidad por tienda: cuánto se vende cada prenda comparado con lo que costó
function statsTienda(t) {
  const compras = S.compras.filter(c => c.tiendaId === t.id);
  const ids = new Set(compras.map(c => c.id));
  const ps = S.prendas.filter(p => ids.has(p.compraId));
  const vs = ps.filter(p => p.estado === 'vendida');
  const vf = vs.filter(costoFinal);
  const invertido = suma(compras, c => c.costo);
  const vendido = suma(vs, p => p.precioVenta);
  const vendidoF = suma(vf, p => p.precioVenta), costoF = suma(vf, costoDe);
  const gan = vendidoF - costoF;
  return {
    compras, registradas: ps.length, vendidas: vs.length, vendidasFinal: vf.length, invertido, vendido, gan,
    por1000: costoF > 0 ? Math.round(vendidoF / costoF * 1000) : 0,
    ganPorPrenda: vf.length ? gan / vf.length : 0,
    dias: vf.length ? suma(vf, p => Math.max(0, (p.fechaVenta - p.creada) / DIA)) / vf.length : 0,
    recuperado: invertido > 0 ? Math.min(1, vendido / invertido) : 0,
    abiertas: compras.filter(compraAbierta).length,
  };
}
// La que más deja se marca solo si hay al menos 2 tiendas con 3 o más prendas vendidas (con costo final)
function mejorTienda() {
  const ok = S.tiendas.map(t => ({ t, st: statsTienda(t) })).filter(x => x.st.vendidasFinal >= 3);
  if (ok.length < 2) return null;
  return ok.reduce((x, y) => (y.st.por1000 > x.st.por1000 ? y : x));
}
function codigoEstimado() {
  let max = Math.max(Number(S.config.ultimoCodigo) || 0, ultimoCodigoLocal);
  for (const p of S.prendas) { const n = parseInt(p.codigo, 10); if (n > max) max = n; }
  return String(max + 1).padStart(6, '0');
}
async function nuevoCodigo() {
  if (backend && backend.siguienteCodigo) return backend.siguienteCodigo();
  const c = codigoEstimado();
  ultimoCodigoLocal = Number(c);
  return c;
}
function coincide(p, q) {
  const nq = normal(q);
  if (!nq) return true;
  if (/^\d+$/.test(nq)) return String(p.codigo || '').includes(nq);
  const texto = normal([p.descripcion, p.tipo, p.color, p.talla, p.codigo, p.talla ? 'talla ' + p.talla : ''].join(' '));
  return nq.split(/\s+/).every(w => texto.includes(w));
}
const detalleLinea = p => [p.tipo, p.talla ? 'talla ' + p.talla : '', p.color ? 'color ' + String(p.color).toLowerCase() : ''].filter(Boolean).join(', ');
const htmlFotoMini = p => p.foto ? `<img src="${p.foto}" alt="">` : `<span class="sin-foto">${ICON.percha}</span>`;

function rangoPeriodo() {
  const hoy0 = inicioDia(Date.now());
  if (periodo.modo === 'semana') {
    const lunes = new Date(hoy0);
    lunes.setDate(lunes.getDate() - ((lunes.getDay() + 6) % 7) + 7 * periodo.offset);
    const filas = [];
    for (let i = 0; i < 7; i++) {
      const a = new Date(lunes); a.setDate(lunes.getDate() + i);
      const b = new Date(a); b.setDate(a.getDate() + 1);
      filas.push({ ini: a.getTime(), fin: b.getTime(), nombre: a.getTime() === hoy0 ? 'Hoy' : mayus(fDiaSemana.format(a)), futuro: a.getTime() > hoy0 });
    }
    const dom = new Date(filas[6].ini);
    const titulo = periodo.offset === 0 ? 'Esta semana' : periodo.offset === -1 ? 'Semana pasada' : `Semana del ${lunes.getDate()} de ${fMes.format(lunes)}`;
    const sub = `Del lunes ${lunes.getDate()}${lunes.getMonth() !== dom.getMonth() ? ' de ' + fMes.format(lunes) : ''} al domingo ${dom.getDate()} de ${fMes.format(dom)}`;
    return { ini: filas[0].ini, fin: filas[6].fin, filas, titulo, sub };
  }

async function cargarImagen(file, max) {
  const img = await new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(url), 2000); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); };
    im.src = url;
  });

  if (!max || !window.createImageBitmap || Math.max(w, h) <= max) return img;
  try { return await createImageBitmap(file, w >= h ? { resizeWidth: max, resizeQuality: 'high' } : { resizeHeight: max, resizeQuality: 'high' }); }
  catch (e) { return img; }

function lienzoDe(img, max, rot = 0) {
  const w0 = img.naturalWidth || img.videoWidth || img.width, h0 = img.naturalHeight || img.videoHeight || img.height;
  const r = Math.min(1, max / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * r)), h = Math.max(1, Math.round(h0 * r));
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  if (rot === 90) { c.width = h; c.height = w; g.translate(h, 0); g.rotate(Math.PI / 2); }
  else { c.width = w; c.height = h; }
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.drawImage(img, 0, 0, w, h);
  return c;
}

function normalizarOpciones(lista, validos, clave) {
  if (!Array.isArray(lista)) return [];
  const out = [];

    const v = validos.find(t => normal(t) === normal(nombre));

    let p = Number(x && x.prob);
    if (!(p >= 0)) p = 0;
    if (p > 1) p = p / 100;
    out.push({ v, p });

  const s = out.reduce((a, o) => a + o.p, 0);

function ventaPorCodigo(v) {

// Escáner con la cámara (en vivo cuando se puede; si no, con una foto)
const ESCN = { activo: false, stream: null, timer: 0, detector: null, zx: null, ultimo: '', ultimoT: 0, cuenta: 0, ocupado: false };
async function prepararDecodificador() {
  if (!ESCN.detector && 'BarcodeDetector' in window) {
    try {
      const f = await window.BarcodeDetector.getSupportedFormats();
      if (f.includes('code_128')) ESCN.detector = new window.BarcodeDetector({ formats: ['code_128'] });
    } catch (e) { ESCN.detector = null; }
  }
  if (!ESCN.zx) {
    try {
      await cargarScript(URL_ZXING);
      const Z = window.ZXing;
      const hints = new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128]);
      hints.set(Z.DecodeHintType.TRY_HARDER, true);
      const r = new Z.MultiFormatReader();
      r.setHints(hints);
      ESCN.zx = r;
    } catch (e) { if (!ESCN.detector) throw e; }
  }
}
async function decodificarLienzo(c) {
  if (ESCN.detector) {
    try { const r = await ESCN.detector.detect(c); if (r && r[0] && r[0].rawValue) return r[0].rawValue; } catch (e) { /* sigue con ZXing */ }
  }
  if (ESCN.zx && window.ZXing) {
    try {
      const Z = window.ZXing;
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)));
      return ESCN.zx.decodeWithState(bmp).getText();
    } catch (e) { /* no se encontró código */ }
  }
  return null;
}
function pintarEscaner(msg, estado) {
  $('#escMsg').textContent = msg;
  const m = $('#escMarco');
  m.classList.remove('ok', 'mal');
  if (estado) { m.classList.add(estado); setTimeout(() => m.classList.remove(estado), 900); }
  $('#escCuenta').textContent = `${plural(ESCN.cuenta, 'prenda escaneada', 'prendas escaneadas')} en esta venta`;
}
function pitar(ok) {
  try { if (navigator.vibrate) navigator.vibrate(ok ? 70 : [60, 60, 60]); } catch (e) { /* opcional */ }
  try {
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    ESCN.audio = ESCN.audio || new A();
    const o = ESCN.audio.createOscillator(), g = ESCN.audio.createGain();
    o.frequency.value = ok ? 1250 : 300; g.gain.value = 0.08;
    o.connect(g); g.connect(ESCN.audio.destination);
    o.start(); o.stop(ESCN.audio.currentTime + (ok ? 0.09 : 0.25));
  } catch (e) { /* opcional */ }
}
function manejarCodigo(texto) {
  const dig = String(texto || '').replace(/\D/g, '');
  if (!dig) return;
  const cod = dig.padStart(6, '0');
  const ahora = Date.now();
  if (cod === ESCN.ultimo && ahora - ESCN.ultimoT < 2500) return;
  ESCN.ultimo = cod; ESCN.ultimoT = ahora;
  const p = S.prendas.find(x => x.codigo === cod);
  if (!p) { pitar(false); pintarEscaner(`El código ${cod} no está en la tienda.`, 'mal'); return; }
  const r = agregarAlCarrito(p, true);
  if (r === true) { ESCN.cuenta++; pitar(true); pintarEscaner(`Agregada: ${p.descripcion}, ${col(p.precio)}.`, 'ok'); }
  else if (r === 'repetida') pintarEscaner(`${p.descripcion} ya está en la venta.`, 'ok');
  else { pitar(false); pintarEscaner(`${p.descripcion} ya se vendió el ${fCorta.format(p.fechaVenta)}.`, 'mal'); }
}
async function abrirEscaner() {
  ESCN.cuenta = 0; ESCN.ultimo = '';
  const ov = $('#escaner');
  ov.hidden = false;
  document.body.classList.add('con-hoja');
  $('#escVivo').hidden = false; $('#escFoto').hidden = true;
  pintarEscaner('Abriendo la cámara…');
  const decod = prepararDecodificador().catch(() => null);
  let stream = null;
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
    catch (e) { console.warn('Cámara en vivo no disponible:', e && e.name); }
  }
  await decod;
  if (ov.hidden) { if (stream) stream.getTracks().forEach(t => t.stop()); return; }
  if (!stream || (!ESCN.detector && !ESCN.zx)) { if (stream) stream.getTracks().forEach(t => t.stop()); modoFotoEscaner(); return; }
  ESCN.stream = stream; ESCN.activo = true;
  const v = $('#escVideo');
  v.srcObject = stream;
  try { await v.play(); } catch (e) { /* algunos navegadores ya lo reproducen */ }
  pintarEscaner('Apunte la cámara al código de barras de la etiqueta.');
  const lienzo = document.createElement('canvas');
  const paso = async () => {
    if (!ESCN.activo) return;
    if (!ESCN.ocupado && v.videoWidth) {
      ESCN.ocupado = true;
      try {
        let t = null;
        if (ESCN.detector) { try { const r = await ESCN.detector.detect(v); if (r && r[0]) t = r[0].rawValue; } catch (e) { /* sigue */ } }
        if (!t && ESCN.zx) {
          const esc = Math.min(1, 960 / v.videoWidth);
          lienzo.width = Math.round(v.videoWidth * esc); lienzo.height = Math.round(v.videoHeight * esc);
          lienzo.getContext('2d').drawImage(v, 0, 0, lienzo.width, lienzo.height);
          t = await decodificarLienzo(lienzo);
        }
        if (t) manejarCodigo(t);
      } finally { ESCN.ocupado = false; }
    }
    ESCN.timer = setTimeout(paso, 220);
  };
  paso();
}
function modoFotoEscaner() {
  $('#escVivo').hidden = true; $('#escFoto').hidden = false;
  pintarEscaner('Tome una foto de cerca al código de barras de la etiqueta.');
}
async function escanearFoto(file) {
  if (!file) return;
  pintarEscaner('Leyendo el código…');
  try {
    await prepararDecodificador();
    const img = await cargarImagen(file, 1600);
    let t = null;
    try {
      for (const max of [1600, 1000]) {
        for (const rot of [0, 90]) { t = await decodificarLienzo(lienzoDe(img, max, rot)); if (t) break; }
        if (t) break;
      }
    } finally { soltarImagen(img); }
    if (t) manejarCodigo(t);
    else { pitar(false); pintarEscaner('No se pudo leer el código. Acérquese más, que se vea nítido y sin reflejo, o escriba el número.', 'mal'); }
  } catch (e) { pintarEscaner('No se pudo leer la foto. Pruebe otra vez.', 'mal'); }
}
function cerrarEscaner() {
  ESCN.activo = false;
  clearTimeout(ESCN.timer);
  if (ESCN.stream) { ESCN.stream.getTracks().forEach(t => t.stop()); ESCN.stream = null; }
  const v = $('#escVideo'); if (v) v.srcObject = null;
  $('#escaner').hidden = true;
  if ($('#hoja').hidden) document.body.classList.remove('con-hoja');
  if (vista === 'vender') pintarCarrito(true);
}

/* ================= PRENDAS ================= */
function coincideOrigen(p, o) {
  if (!o) return true;
  if (o === '_sin') return !compraPorId(p.compraId);
  const id = o.slice(2);
  if (o.startsWith('c:')) return p.compraId === id;
  if (o.startsWith('t:')) { const c = compraPorId(p.compraId); return !!c && c.tiendaId === id; }
  return true;
}
const precioDe = p => p.estado === 'vendida' ? (p.precioVenta || 0) : (p.precio || 0);
const enRango = (p, min, max) => precioDe(p) >= (min || 0) && (!max || precioDe(p) <= max);
// sin: el filtro que no se aplica, para contar cuántas habría en cada opción de ese filtro
function prendasFiltradas(sin) {
  let ps = S.prendas;
  if (filtro.estado !== 'todas') ps = ps.filter(p => p.estado === filtro.estado);
  if (filtro.tipo && sin !== 'tipo') ps = ps.filter(p => p.tipo === filtro.tipo);
  if (filtro.genero && sin !== 'genero') ps = ps.filter(p => generoDe(p) === filtro.genero);
  if (filtro.color && sin !== 'color') ps = ps.filter(p => p.color === filtro.color);
  if ((filtro.pmin || filtro.pmax) && sin !== 'precio') ps = ps.filter(p => enRango(p, filtro.pmin, filtro.pmax));
  if (filtro.origen) ps = ps.filter(p => coincideOrigen(p, filtro.origen));
  if (filtro.viejas) ps = ps.filter(p => p.estado === 'disponible' && diasDesde(p.creada) >= 30);
  if (filtro.q) ps = ps.filter(p => coincide(p, filtro.q));
  const t = p => p.estado === 'vendida' ? p.fechaVenta : p.creada;
  return ps.slice().sort((a, b) => t(b) - t(a));
}
function pintarChipsTipo() {
  const el = $('#chipsTipoF');
  if (!el) return;
  const base = prendasFiltradas('tipo');
  const cuentas = {};
  for (const p of base) cuentas[p.tipo] = (cuentas[p.tipo] || 0) + 1;
  const tipos = TIPOS.filter(t => cuentas[t] || t === filtro.tipo);
  el.innerHTML = `<button type="button" class="chip" data-accion="filtro-tipo" data-valor="" aria-pressed="${!filtro.tipo}">Todos<small>${nf.format(base.length)}</small></button>`
    + tipos.map(t => `<button type="button" class="chip" data-accion="filtro-tipo" data-valor="${esc(t)}" aria-pressed="${filtro.tipo === t}">${esc(t)}<small>${nf.format(cuentas[t] || 0)}</small></button>`).join('');
}
const filtrosExtra = () => [filtro.genero, filtro.color, filtro.pmin || filtro.pmax].filter(Boolean).length;
function pintarFiltrosExtra() {
  const el = $('#filtrosExtra');
  if (!el) return;
  const cuenta = (sin, f) => prendasFiltradas(sin).filter(f).length;

  $('#chipsGenero').innerHTML = chip('filtro-genero', '', 'Todos', prendasFiltradas('genero').length, !filtro.genero)
    + GENEROS.map(g => chip('filtro-genero', g, g, cuenta('genero', p => generoDe(p) === g), filtro.genero === g)).join('');
  const baseColor = prendasFiltradas('color');

  $('#chipsColorF').innerHTML = chip('filtro-color', '', 'Todos', baseColor.length, !filtro.color)

  const basePrecio = prendasFiltradas('precio');
  $('#chipsPrecioF').innerHTML = chip('filtro-precio', '', 'Todos', basePrecio.length, !filtro.pmin && !filtro.pmax)
    + RANGOS_PRECIO.map(([a, b, t]) => chip('filtro-precio', `${a}-${b}`, t, basePrecio.filter(p => enRango(p, a, b)).length, filtro.pmin === a && filtro.pmax === b)).join('');
  const setv = (id, v) => { const i = $('#' + id); if (i && document.activeElement !== i) i.value = v || ''; };
  setv('fPmin', filtro.pmin); setv('fPmax', filtro.pmax);
  const n = filtrosExtra();

function htmlChipsTienda(sel, nueva) {

const soloDigitos = v => String(v || '').replace(/\D/g, '');
const telBonito = t => t && t.length === 8 ? `${t.slice(0, 4)} ${t.slice(4)}` : (t || '');
const clientePorTel = t => t ? S.clientes.find(x => x.telefono === t) : undefined;
const comprasDeCliente = t => S.prendas.filter(p => p.estado === 'vendida' && p.clienteTel === t);
function coincideCliente(x, q) {
  const nq = normal(q), d = soloDigitos(q);
  if (!nq) return true;
  if (d && d.length === nq.replace(/\s/g, '').length) return x.telefono.includes(d);
  const texto = normal(x.nombre);
  return nq.split(/\s+/).every(w => texto.includes(w));
}

function statsCliente(tel) {
  const vs = comprasDeCliente(tel);
  const ventas = new Set(vs.map(p => p.ventaId || p.id)).size;
  return { prendas: vs.length, ventas, gasto: suma(vs, p => p.precioVenta), ultima: vs.length ? Math.max(...vs.map(p => p.fechaVenta)) : 0 };
}
const filtroClientes = { q: '', orden: 'gasto' };
function pintarVistaClientes() {
  const cont = $('#listaVistaClientes');
  if (!cont) return;
  const todos = S.clientes.map(x => ({ x, st: statsCliente(x.telefono) }));
  $('#cifrasClientes').innerHTML = `<div><dt>Clientes</dt><dd>${nf.format(todos.length)}</dd></div>
    <div><dt>Le han comprado</dt><dd>${col(suma(todos, c => c.st.gasto))}</dd></div>`;
  $$('[data-accion="orden-clientes"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.valor === filtroClientes.orden)));
  const lista = todos.filter(c => coincideCliente(c.x, filtroClientes.q))
    .sort(filtroClientes.orden === 'nombre' ? (a, b) => a.x.nombre.localeCompare(b.x.nombre, 'es') : (a, b) => b.st.gasto - a.st.gasto || b.st.ultima - a.st.ultima);
  if (!todos.length) { cont.innerHTML = '<div class="vacio mt"><p><b>Todavía no hay clientes.</b></p><p>Agréguelos aquí o al guardar una venta.</p></div>'; return; }
  if (!lista.length) { cont.innerHTML = `<div class="vacio mt"><p>No hay clientes con “${esc(filtroClientes.q)}”.</p></div>`; return; }
  cont.innerHTML = lista.slice(0, 200).map(({ x, st }) => `<button type="button" class="fila-cliente" data-accion="ver-cliente" data-id="${esc(x.telefono)}">
      <b>${esc(x.nombre)}</b><span class="fc-total">${col(st.gasto)}</span>
      <span class="nota">Tel. ${esc(telBonito(x.telefono))} · ${st.prendas ? `${plural(st.prendas, 'prenda', 'prendas')} en ${plural(st.ventas, 'compra', 'compras')} · la última ${hace(st.ultima)}` : 'todavía no ha comprado'}</span>
    </button>`).join('') + (lista.length > 200 ? `<p class="nota">y ${lista.length - 200} más. Escriba para buscar.</p>` : '');
}

async function compartirCatalogo() {
  if (!S.config.whatsapp) toast('Consejo: ponga el WhatsApp de la tienda en Ajustes para que los clientes le escriban desde el catálogo.');
  const texto = textoCatalogo('');
  if (navigator.share) {
    try { await navigator.share({ title: S.config.nombre || 'Catálogo', text: texto }); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(texto); toast('Enlace del catálogo copiado. Péguelo en WhatsApp.', 'bien'); }

}
function abrirCliente(tel) {
  const x = clientePorTel(tel);
  if (!x) return;
  const vs = comprasDeCliente(tel);
  const st = statsCliente(tel);
  // agrupa por venta: lo que se llevó cada vez
  const grupos = new Map();
  for (const p of vs) { const k = p.ventaId || p.id; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p); }
  const ventas = [...grupos.values()].map(ps => ({ ps, fecha: ps[0].fechaVenta, total: suma(ps, p => p.precioVenta) })).sort((a, b) => b.fecha - a.fecha);
  abrirHoja(`<h2>${esc(x.nombre)}</h2>
    <p class="nota">Teléfono ${esc(telBonito(x.telefono))}${st.prendas ? ` · cliente desde el ${fCorta.format(Math.min(...vs.map(p => p.fechaVenta)))}` : ''}</p>
    <dl class="cifras">
      <div><dt>Ha gastado</dt><dd>${col(st.gasto)}</dd></div>
      <div><dt>Compras</dt><dd>${nf.format(st.ventas)}</dd></div>
      <div><dt>Prendas</dt><dd>${nf.format(st.prendas)}</dd></div>
      ${st.ventas ? `<div><dt>Gasta por compra</dt><dd>${col(Math.round(st.gasto / st.ventas))}</dd></div>` : ''}
    </dl>
    ${ventas.length ? `<h3 class="grupo-sel">Lo que ha comprado</h3>${ventas.slice(0, 40).map(v => `<div class="venta-cliente">
      <div class="vc-cab"><span>${esc(fLarga.format(v.fecha))}</span><span>${col(v.total)}</span></div>
      <ul>${v.ps.map(p => `<li>${esc(p.descripcion)}${p.talla ? `, talla ${esc(p.talla)}` : ''}: ${col(p.precioVenta)}</li>`).join('')}</ul></div>`).join('')}` : '<p class="nota">Todavía no le ha comprado nada.</p>'}
    <div class="botones-hoja">

// Contactos del teléfono (Chrome en Android). Se toma el nombre y el número.
const hayContactos = () => !!(navigator.contacts && navigator.contacts.select && window.isSecureContext);
function telDeContacto(t) {
  let d = soloDigitos(t);
  if (d.length === 11 && d.startsWith('506')) d = d.slice(3);   // +506 de Costa Rica
  return d;
}
// primero los celulares (en Costa Rica empiezan con 5, 6, 7 u 8)
const esCelular = t => /^[5-8]\d{7}$/.test(t);
const telsValidos = c => [...new Set((c.tel || []).map(telDeContacto))].filter(t => t.length >= 8 && t.length <= 15).sort((a, b) => esCelular(b) - esCelular(a));
const nombreDeContacto = c => String((c.name || [])[0] || '').trim().slice(0, 60);
async function elegirContactos(multiple) {
  try { return await navigator.contacts.select(['name', 'tel'], { multiple }); }
  catch (e) { console.warn('Contactos', e); toast('No se pudieron abrir los contactos.', 'mal'); return null; }
}
async function contactoAlFormulario() {
  const r = await elegirContactos(false);
  if (!r || !r[0] || !$('#cNombre')) return;
  const nombre = nombreDeContacto(r[0]), tels = telsValidos(r[0]);
  if (nombre) $('#cNombre').value = nombre;
  if (!tels.length) { toast('Ese contacto no tiene un teléfono que sirva. Escríbalo.', 'mal'); return; }
  $('#cTel').value = telBonito(tels[0]);
  $('#telsContacto').innerHTML = tels.length > 1 ? `<p class="nota mt">Tiene ${tels.length} números. ¿Cuál es?</p><div class="tels-contacto">${tels.map((t, i) => `<button type="button" class="chip" data-accion="tel-contacto" data-valor="${t}" aria-pressed="${i === 0}">${telBonito(t)}</button>`).join('')}</div>` : '';
}
async function contactoAVenta() {
  const r = await elegirContactos(false);
  if (!r || !r[0]) return;
  const nombre = nombreDeContacto(r[0]), tels = telsValidos(r[0]);
  const ya = tels.map(clientePorTel).find(Boolean);
  if (ya) { cerrarHoja(); ponerClienteVenta(ya.telefono); toast(`Venta para ${ya.nombre}.`, 'bien'); return; }
  if (!nombre || tels.length !== 1) {   // falta algo o hay que escoger número: que lo revise en el formulario

    if (nombre) $('#cNombre').value = nombre;

    return;
  }
  const x = { telefono: tels[0], nombre, creada: Date.now() };
  if (await escribir(() => backend.ponerCliente(x))) { cerrarHoja(); ponerClienteVenta(x.telefono); toast(`Cliente agregado. Venta para ${nombre}.`, 'bien'); }
}
async function importarContactos() {
  const r = await elegirContactos(true);
  if (!r || !r.length) return;
  const nuevos = [], vistos = new Set();
  let yaEstaban = 0, sinTel = 0;
  for (const c of r) {
    const nombre = nombreDeContacto(c), tels = telsValidos(c);
    if (!nombre || !tels.length) { sinTel++; continue; }
    if (tels.some(t => clientePorTel(t))) { yaEstaban++; continue; }
    if (vistos.has(tels[0])) continue;
    vistos.add(tels[0]);
    nuevos.push({ telefono: tels[0], nombre, creada: Date.now() });
  }
  const notas = [yaEstaban ? `${plural(yaEstaban, 'ya estaba', 'ya estaban')} en sus clientes` : '', sinTel ? `${plural(sinTel, 'no tiene', 'no tienen')} nombre o teléfono` : ''].filter(Boolean).join(' y ');
  if (!nuevos.length) { toast(`No hay clientes nuevos para agregar${notas ? ': ' + notas : ''}.`); return; }
  abrirHoja(`<h2>Agregar ${plural(nuevos.length, 'cliente', 'clientes')}</h2>
    ${notas ? `<p class="nota">De los que eligió, ${notas}.</p>` : ''}
    <div class="lista-sel">${nuevos.map(x => `<div class="opcion-sel"><span class="os-texto"><b>${esc(x.nombre)}</b><span class="nota">${esc(telBonito(x.telefono))}</span></span></div>`).join('')}</div>
    <p class="resultado" id="avanceContactos" aria-live="polite"></p>
    <div class="botones-hoja">
      <button type="button" class="btn btn-gana btn-enorme" id="siContactos">Agregar ${plural(nuevos.length, 'cliente', 'clientes')}</button>
      <button type="button" class="btn btn-sec btn-enorme" data-cerrar>Cancelar</button>
    </div>`, el => {
      $('#siContactos', el).onclick = async e => {
        e.currentTarget.disabled = true;
        const av = $('#avanceContactos', el);
        for (let i = 0; i < nuevos.length; i++) {
          if (!(await escribir(() => backend.ponerCliente(nuevos[i])))) { e.currentTarget.disabled = false; return; }
          av.textContent = `Agregando… ${i + 1} de ${nuevos.length}`;
        }
        cerrarHoja(); toast(`${plural(nuevos.length, 'cliente agregado', 'clientes agregados')}.`, 'bien');
      };
    }, 'Agregar clientes');
}

async function guardarEdicion(id, btn) {
  const p = buscar(id);
  if (!p) return;
  const precio = num($('#ePrecio').value);
  if (precio <= 0) { toast('Escriba el precio de etiqueta.', 'mal'); return; }
  const costoNuevo = num($('#eCosto').value);
  const compraId = $('#eCompra').value;
  const cambios = {
    descripcion: $('#eDesc').value.trim() || $('#eTipo').value, tipo: $('#eTipo').value,
    talla: $('#eTalla').value.trim(), color: $('#eColor').value, genero: $('#eGenero').value, compraId, precio,
  };
  if (costoNuevo !== costoDe(p) || !compraPorId(compraId)) { cambios.costo = costoNuevo; cambios.costoFijo = true; }
  if (precio !== p.precio) cambios.impresa = false;
  if (p.estado === 'vendida' && $('#eVenta')) cambios.precioVenta = num($('#eVenta').value);
  btn.disabled = true;
  const ok = await escribir(() => backend.actualizarPrenda(id, cambios));
  btn.disabled = false;
  if (ok) { cerrarHoja(); toast(cambios.impresa === false ? 'Cambios guardados. Vuelva a imprimir la etiqueta con el precio nuevo.' : 'Cambios guardados.', 'bien'); }
}

/* ================= ETIQUETAS ================= */
let fuentesOk = null;
function fuentesListas() {
  if (!fuentesOk) fuentesOk = Promise.race([
    Promise.all([document.fonts.load('700 40px "Atkinson Hyperlegible"'), document.fonts.load('400 40px "Atkinson Hyperlegible"')]).catch(() => null),
    espera(2500),
  ]);
  return fuentesOk;
}
function recortar(g, t, ancho) {
  t = String(t || '');
  if (g.measureText(t).width <= ancho) return t;
  while (t.length > 1 && g.measureText(t + '…').width > ancho) t = t.slice(0, -1);
  return t.trim() + '…';
}
// Medidas en "u": 1 u = 1 mm en una etiqueta de 48 × 30 mm; en otras se escala según lo que quepa.
// Si la etiqueta es más alta, el espacio de sobra se reparte entre las partes y el código de barras crece un poco.
// k = puntos por mm (16 en pantalla y PDF, 8 en la impresora térmica); anchoMm y altoMm = lo que se alcanza a imprimir.
async function dibujarEtiqueta(p, k = PXMM, anchoMm = 0, altoMm = 0) {
  await fuentesListas();
  const t = tamanoEtiqueta();
  const wMm = anchoMm || t.w, hMm = altoMm || t.h;
  const u = Math.min(hMm / 30, wMm / 48) * k;
  const W = Math.round(wMm * k), H = Math.round(hMm * k);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  const fam = '"Atkinson Hyperlegible", Arial, sans-serif';
  const m = 1.5 * u, ancho = W - 2 * m;
  const caja = (x, y, w, h, r) => { g.beginPath(); if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h); };
  const espaciado = px => { if ('letterSpacing' in g) g.letterSpacing = px + 'px'; };
  // Achica la letra hasta que el texto quepa en el ancho dado
  const ajustar = (txt, peso, tam, min, w) => { g.font = `${peso} ${tam}px ${fam}`; while (g.measureText(txt).width > w && tam > min) { tam -= 0.1 * u; g.font = `${peso} ${tam}px ${fam}`; } return tam; };

  const hBanda = 4.6 * u, hDesc = 3.6 * u, hPrecio = 6.2 * u, sPie = 2.3 * u;
  const fijo = 1.2 * u + hBanda + 0.9 * u + hDesc + hPrecio + 1 * u + 0.6 * u + sPie + 1.3 * u;
  let altoBarras = H - fijo, extra = 0;
  if (altoBarras > 10 * u) { extra = (altoBarras - 10 * u) / 4; altoBarras = 10 * u; }

  // Nombre de la tienda con una línea fina debajo (sin negro sólido: las térmicas pequeñas lo imprimen gris o rayado)
  let y = 1.2 * u;
  g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const nombre = (S.config.nombre || 'Mi tienda').toUpperCase();
  espaciado(0.35 * u);
  ajustar(nombre, 700, 3.4 * u, 2 * u, ancho);
  g.fillText(recortar(g, nombre, ancho), W / 2, y + hBanda / 2 - 0.2 * u);
  espaciado(0);
  g.fillRect(m, Math.round(y + hBanda - 0.3 * u), ancho, Math.max(2, Math.round(0.3 * u)));
  y += hBanda + 0.9 * u + extra;

  // Nombre de la prenda
  g.fillStyle = '#000'; g.textAlign = 'left'; g.textBaseline = 'top';
  g.font = `400 ${3 * u}px ${fam}`;
  g.fillText(recortar(g, p.descripcion || p.tipo, ancho), m, y);
  y += hDesc + extra;

  // Precio grande y, a la derecha, la talla en un recuadro
  let wTalla = 0;
  if (p.talla) {
    g.font = `700 ${3.6 * u}px ${fam}`;
    wTalla = Math.max(8 * u, g.measureText(p.talla).width + 2.4 * u);
    const xT = W - m - wTalla;
    g.lineWidth = Math.max(2, 0.35 * u);
    caja(xT + g.lineWidth / 2, y + g.lineWidth / 2, wTalla - g.lineWidth, hPrecio - g.lineWidth, 0.9 * u); g.stroke();
    g.textAlign = 'center';
    g.font = `700 ${1.5 * u}px ${fam}`; espaciado(0.15 * u);
    g.fillText('TALLA', xT + wTalla / 2, y + 0.7 * u);
    espaciado(0);
    g.font = `700 ${3.6 * u}px ${fam}`;
    g.fillText(recortar(g, p.talla, wTalla - 1.2 * u), xT + wTalla / 2, y + 2.3 * u);
    g.textAlign = 'left';
  }
  const sPrecio = ajustar(col(p.precio), 700, 6.6 * u, 3 * u, ancho - (wTalla ? wTalla + 1.5 * u : 0));
  g.textBaseline = 'alphabetic';
  g.fillText(col(p.precio), m - 0.2 * u, y + hPrecio / 2 + 0.36 * sPrecio);
  y += hPrecio + 1 * u + extra;

  // Código de barras
  if (window.JsBarcode && altoBarras > 4 * k) {
    let modulo = Math.max(2, Math.round(0.375 * k)), bc = null;
    do {
      bc = document.createElement('canvas');
      window.JsBarcode(bc, String(p.codigo), { format: 'CODE128', width: modulo, height: Math.floor(altoBarras), displayValue: false, margin: 0, background: '#ffffff', lineColor: '#000000' });
      modulo--;
    } while (bc.width > ancho && modulo >= 2);
    g.imageSmoothingEnabled = false;
    g.drawImage(bc, Math.round((W - bc.width) / 2), Math.round(y));
  }

  // Abajo: el código de la prenda y el teléfono de la tienda (8819-3754)
  const yPie = H - 1.3 * u;
  const cod = String(p.codigo), w8 = S.config.whatsapp || '';
  const tel = w8.length === 8 ? `${w8.slice(0, 4)}-${w8.slice(4)}` : w8;
  g.font = `700 ${sPie}px ${fam}`;
  if (tel) {
    g.fillText(cod, m, yPie);
    g.textAlign = 'right'; g.fillText(recortar(g, tel, ancho - g.measureText(cod).width - 2 * u), W - m, yPie);
  } else { g.textAlign = 'center'; g.fillText(cod, W / 2, yPie); }
  g.textAlign = 'left';
  return c;
}
// La etiqueta entera como va a salir: lo impreso ocupa solo la parte que alcanza la impresora (ver BT_CORRIDO_X)
async function etiquetaCompleta(p) {
  const t = tamanoEtiqueta(), k = PXMM;
  const ancho = Math.min(t.w - BT_CORRIDO_X, BT_ANCHO_CABEZAL), alto = t.h - BT_CORRIDO_Y;
  const dentro = await dibujarEtiqueta(p, k, ancho, alto);
  const c = document.createElement('canvas');
  c.width = Math.round(t.w * k); c.height = Math.round(t.h * k);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(dentro, Math.round((t.w - ancho) / 2 * k), Math.round((t.h - alto) / 2 * k));
  return c;
}

/* ================= IMPRESORA POR BLUETOOTH ================= */
// Impresoras de etiquetas que entienden TSPL por Bluetooth LE (por ejemplo la HOIN HL2200).
// Cada etiqueta se manda como una imagen en blanco y negro, igual a la vista previa.
const BT_SERVICIOS = [
  0x18f0, 0xff00, 0xffe0, 0xfff0, 0xae30, 0xae00, 0xfee7, 0xff10,
  '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
];
const BT_PUNTOS_MM = 8;          // 203 dpi
const BT_ANCHO_CABEZAL = 48;     // mm que alcanza a imprimir el cabezal
// En la HL2200 lo impreso cae corrido a la derecha (se pierden unos 8 mm del lado derecho) y 2 mm más abajo: se deja ese margen
const BT_CORRIDO_X = 8, BT_CORRIDO_Y = 2.5;
const BT = { disp: null, car: null, trozo: 180 };
const hayBluetooth = () => !!navigator.bluetooth;

async function conectarImpresora() {
  if (BT.car && BT.disp.gatt.connected) return;
  if (!BT.disp) {
    BT.disp = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: BT_SERVICIOS });
    BT.disp.addEventListener('gattserverdisconnected', () => { BT.car = null; });
  }
  const gatt = await BT.disp.gatt.connect();
  for (const sv of await gatt.getPrimaryServices()) {
    if (/^0000180[01a]-/.test(sv.uuid)) continue;
    let cs = [];
    try { cs = await sv.getCharacteristics(); } catch (e) { continue; }
    const c = cs.find(x => x.properties.write || x.properties.writeWithoutResponse);
    if (c) { BT.car = c; return; }
  }
  BT.disp = null;
  throw { code: 'bt_sin_canal' };
}
// Manda en pedazos; si la impresora no acepta pedazos grandes, sigue de 20 en 20 bytes
async function enviarBT(bytes) {
  const c = BT.car;
  for (let i = 0; i < bytes.length;) {
    const parte = bytes.slice(i, i + BT.trozo);
    try {
      if (c.properties.write) await c.writeValueWithResponse(parte);
      else { await c.writeValueWithoutResponse(parte); await espera(20); }
      i += parte.length;
    } catch (e) {
      if (BT.trozo > 20) { BT.trozo = 20; continue; }
      throw e;
    }
  }
}
// Imagen a 1 bit para el comando BITMAP de TSPL (0 = punto negro)
function bitsTspl(c) {
  const W = c.width, H = c.height, bw = Math.ceil(W / 8);
  const px = c.getContext('2d').getImageData(0, 0, W, H).data;
  const out = new Uint8Array(bw * H).fill(0xff);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    if (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11 < 140) out[y * bw + (x >> 3)] &= ~(0x80 >> (x & 7));
  }
  return { bw, H, out };
}
async function imprimirBluetooth(lista, boton) {
  const antes = boton.innerHTML;
  boton.textContent = 'Conectando con la impresora…';
  try {
    await conectarImpresora();
    const t = tamanoEtiqueta(), ancho = Math.min(t.w - BT_CORRIDO_X, BT_ANCHO_CABEZAL), alto = t.h - BT_CORRIDO_Y;
    const ascii = s => new TextEncoder().encode(s);
    await enviarBT(ascii(`SIZE ${t.w} mm,${t.h} mm\r\nGAP 2 mm,0 mm\r\nDIRECTION 1\r\n`));
    for (let i = 0; i < lista.length; i++) {
      boton.textContent = lista.length > 1 ? `Imprimiendo ${i + 1} de ${lista.length}…` : 'Imprimiendo…';
      const b = bitsTspl(await dibujarEtiqueta(lista[i], BT_PUNTOS_MM, ancho, alto));
      const ini = ascii(`CLS\r\nBITMAP 0,0,${b.bw},${b.H},0,`), fin = ascii('\r\nPRINT 1,1\r\n');
      const todo = new Uint8Array(ini.length + b.out.length + fin.length);
      todo.set(ini); todo.set(b.out, ini.length); todo.set(fin, ini.length + b.out.length);
      await enviarBT(todo);
    }
    toast(lista.length > 1 ? `Listo: se mandaron ${lista.length} etiquetas a la impresora.` : 'Listo: se mandó la etiqueta a la impresora.', 'bien');
  } catch (e) {
    if (e && e.name === 'NotFoundError') { /* cerró la lista sin elegir */ }
    else if (e && e.code === 'bt_sin_canal') toast('Se conectó, pero esa impresora no deja mandarle etiquetas. ¿Eligió la impresora correcta?', 'mal');
    else { BT.car = null; toast('No se pudo imprimir. Revise que la impresora esté encendida y que la app Diabel esté cerrada, y vuelva a intentar.', 'mal'); }
  }
  boton.innerHTML = antes;
}

async function cargarRespaldo(file) {

  if (!d || !Array.isArray(d.prendas) || !Array.isArray(d.compras)) { toast('Ese archivo no es un respaldo de la tienda.', 'mal'); return; }
  const tiendas = (Array.isArray(d.tiendas) ? d.tiendas : []).filter(t => t && t.id && typeof t.id === 'string' && t.nombre).map(t => ({ id: t.id, nombre: String(t.nombre).slice(0, 60), zona: String(t.zona || ''), nota: String(t.nota || ''), creada: Number(t.creada) || Date.now() }));

  const tels = new Set([...clientes.map(x => x.telefono), ...S.clientes.map(x => x.telefono)]);
  const idsTienda = new Set([...tiendas.map(t => t.id), ...S.tiendas.map(t => t.id)]);

  const ids = new Set([...compras.map(c => c.id), ...S.compras.map(c => c.id)]);
  const prendas = d.prendas.filter(p => p && p.id && p.codigo).map(p => ({

  }));

    <div class="botones-hoja">

    $('#btnEntrar').disabled = true; $('#errLogin').textContent = '';
    const { error } = await sbCliente.auth.signInWithPassword({ email: correoDeUsuario(u, cfg.dominioUsuarios), password: clave });
    $('#btnEntrar').disabled = false;
    if (error) { $('#errLogin').textContent = /fetch|network/i.test(error.message) ? 'No hay conexión. Revise el internet.' : 'Usuario o contraseña incorrectos.'; return; }
    arrancarSupabase();
  };
  setTimeout(() => $('#lUsuario').focus(), 50);
}
function arrancarSupabase() {
  document.body.classList.remove('sin-sesion');
  $('#login').hidden = true;
  $('#login').innerHTML = '';
  if (backend) return;
  S.modo = 'supabase';
  backend = new SupaBackend(sbCliente);
  pintarAvisoModo();
  backend.start();
}
async function iniciarSupabase(cfg) {
  try { await cargarScript(URL_SUPABASE); }
  catch (e) { $('#vista').innerHTML = `<div class="vacio mt"><p>No se pudo abrir la tienda. Revise el internet y recargue la página.</p></div>`; return; }
  sbCliente = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'mitienda-sesion' } });
  sbCliente.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.reload(); });
  const { data } = await sbCliente.auth.getSession();
  if (data && data.session) arrancarSupabase(); else mostrarLogin(cfg);
}
