document.addEventListener('click', async e => {
  const el = e.target.closest('[data-sel],[data-ir],[data-accion],[data-prenda],[data-compra],[data-tienda],[data-cerrar],[data-paso],[data-estado]');
  if (!el || el.disabled) return;
  if (el.hasAttribute('data-sel')) { const f = hojaCtx && hojaCtx.alElegir; const v = el.dataset.sel; cerrarHoja(); if (f) f(v); return; }
  if (el.dataset.ir) { cerrarHoja(); ir(el.dataset.ir); return; }
  if (el.hasAttribute('data-cerrar')) { cerrarHoja(); return; }
  if (el.dataset.prenda) { abrirPrenda(el.dataset.prenda); return; }
  if (el.dataset.compra) { abrirCompra(el.dataset.compra); return; }
  if (el.dataset.tienda) { abrirTienda(el.dataset.tienda); return; }
  if (el.dataset.paso) {
    const inp = document.getElementById(el.dataset.paso);
    if (inp) {
      const actual = num(inp.value), d = Number(el.dataset.delta);
      let v = actual + d;
      if (Math.abs(d) === 1000 && (inp.id === 'fPrecio' || inp.id === 'ePrecio')) {
        const redondo = a900(actual) === actual;   // ya termina en 900
        v = d > 0 ? (redondo ? actual + 1000 : a900(actual)) : (redondo ? Math.max(900, actual - 1000) : bajar900(actual));
      }
      inp.value = Math.max(0, v);
      inp.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }
  if (el.dataset.estado) { filtro.estado = el.dataset.estado; filtro.mostrar = 60; VISTAS.prendas.update(); return; }
  const id = el.dataset.id, valor = el.dataset.valor;
  const it = itemActual();
  switch (el.dataset.accion) {
    case 'ajustes': abrirAjustes(); break;
    case 'tema':
      ponerTema(valor || (temaActual() === 'oscuro' ? 'claro' : 'oscuro'));
      $$('[data-accion="tema"][data-valor]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.valor === temaActual())));
      break;
    // compras
    case 'nueva-compra': abrirFormCompra(); break;
    case 'editar-compra': { const c = compraPorId(id); if (c) abrirFormCompra(c); break; }
    case 'borrar-compra':
      confirmar('¿Borrar esta compra?', 'Las prendas que ya registró se quedan en la tienda, pero sin compra. Esto no se puede deshacer.', 'Sí, borrar compra', async () => {
        if (await escribir(() => backend.quitarCompra(id))) { cerrarHoja(); toast('Compra borrada.'); }
      });
      break;
    case 'guardar-compra': guardarCompra(el); break;
    case 'nombre-rapido': { const n = $('#cNombre'); if (n) n.value = el.textContent; break; }
    case 'agregar-de-compra': cerrarHoja(); cola.compraId = id; recalcularPreciosCola(); ir('agregar'); break;
    case 'ver-prendas-compra': cerrarHoja(); Object.assign(filtro, { origen: 'c:' + id, estado: 'todas', tipo: '', q: '', viejas: false, genero: '', color: '', pmin: 0, pmax: 0, mostrar: 60 }); ir('prendas'); break;
    case 'ver-prendas-tienda': cerrarHoja(); Object.assign(filtro, { origen: 't:' + id, estado: 'todas', tipo: '', q: '', viejas: false, genero: '', color: '', pmin: 0, pmax: 0, mostrar: 60 }); ir('prendas'); break;
    case 'compra-tienda':
      if (hojaCtx) { hojaCtx.tiendaId = hojaCtx.tiendaId === valor && !hojaCtx.tiendaNueva ? '' : valor; hojaCtx.tiendaNueva = false; pintarChipsTiendaCompra(); }
      break;
    case 'compra-tienda-nueva':
      if (hojaCtx) { hojaCtx.tiendaNueva = !hojaCtx.tiendaNueva; pintarChipsTiendaCompra(); if (hojaCtx.tiendaNueva) { const i = $('#cTiendaNueva'); if (i) i.focus(); } }
      break;
    // tiendas
    case 'pestana-compras': pestanaCompras = valor; VISTAS.compras.update(); break;
    case 'ver-tiendas': cerrarHoja(); pestanaCompras = 'tiendas'; ir('compras'); break;
    case 'nueva-tienda': abrirFormTienda(); break;
    case 'editar-tienda': { const t = tiendaPorId(id); if (t) abrirFormTienda(t); break; }
    case 'guardar-tienda': guardarTienda(el); break;
    case 'compra-en-tienda': abrirFormCompra(null, id); break;
    case 'cerrar-compra': {
      const c = compraPorId(id); if (!c) break;
      const n = cuentaCompra(c.id);
      if (!n) { toast('Esta compra todavía no tiene prendas.', 'mal'); break; }
      el.disabled = true;
      if (await escribir(() => backend.ponerCompra({ ...c, cantidad: n }))) { cerrarHoja(); toast(`Compra cerrada. Cada prenda de ${c.nombre} costó ${col(Math.round(c.costo / n))}.`, 'bien'); }
      else el.disabled = false;
      break;
    }
    case 'borrar-tienda':
      confirmar('¿Borrar esta tienda?', 'Sus compras y prendas se quedan, pero sin tienda. Esto no se puede deshacer.', 'Sí, borrar tienda', async () => {
        if (await escribir(() => backend.quitarTienda(id))) { cerrarHoja(); toast('Tienda borrada.'); }
      });
      break;
    // filtros
    case 'filtro-tipo': filtro.tipo = valor || ''; filtro.mostrar = 60; pintarChipsTipo(); pintarFiltrosExtra(); pintarListaPrendas(); break;
    case 'filtro-genero': filtro.genero = valor || ''; filtro.mostrar = 60; pintarChipsTipo(); pintarFiltrosExtra(); pintarListaPrendas(); break;
    case 'filtro-color': filtro.color = valor || ''; filtro.mostrar = 60; pintarChipsTipo(); pintarFiltrosExtra(); pintarListaPrendas(); break;
    case 'filtro-precio': { const [a, b] = (valor || '0-0').split('-').map(Number); filtro.pmin = a; filtro.pmax = b; filtro.mostrar = 60; pintarChipsTipo(); pintarFiltrosExtra(); pintarListaPrendas(); break; }
    case 'quitar-filtros': Object.assign(filtro, { genero: '', color: '', pmin: 0, pmax: 0, mostrar: 60 }); pintarChipsTipo(); pintarFiltrosExtra(); pintarListaPrendas(); break;
    case 'filtro-origen': abrirSelectorOrigen(); break;
    case 'elegir-compra-cola': abrirSelectorCompra(); break;
    case 'etiquetas-compra': {
      const ps = S.prendas.filter(p => p.compraId === id && p.estado === 'disponible').sort((a, b) => a.creada - b.creada);
      const pend = ps.filter(p => !p.impresa);
      abrirEtiquetas(pend.length ? pend : ps, pend.length ? 'Etiquetas sin imprimir de esta compra' : 'Etiquetas de esta compra');
      break;
    }
    // agregar prendas
    case 'camara': abrirCamara(); break;
    case 'disparar': dispararCamara(); break;
    case 'cerrar-camara': cerrarCamara(); break;
    case 'sin-foto': compraCola(); cola.items.push(nuevoItem({})); cola.i = cola.items.length - 1; remontarAgregar(); break;
    case 'ir-item': cola.i = Number(valor) || 0; remontarAgregar(); window.scrollTo(0, 0); break;
    case 'elegir-tipo':
      if (!it) break;
      if (it.tipos[0] && it.tipos[0].v !== valor) it.descIA = '';
      it.tipo = valor; it.tocado.add('tipo'); it.verTipos = false;
      pintarPartesItem(); break;
    case 'elegir-color': if (!it) break; it.color = valor; it.tocado.add('color'); it.verColores = false; pintarPartesItem({ color: true }); break;
    case 'elegir-genero': if (!it) break; it.genero = valor; it.tocado.add('genero'); pintarPartesItem({}); break;
    case 'elegir-talla': if (!it) break; it.talla = it.talla === valor ? '' : valor; it.tocado.add('talla'); pintarPartesItem({ talla: true }); break;
    case 'ver-todos': if (!it) break; if (valor === 'tipo') it.verTipos = true; else it.verColores = true; pintarPartesItem({ tipo: valor === 'tipo', color: valor === 'color' }); break;
    case 'precio-rapido': if (!it) break; it.precio = Number(valor); it.tocado.add('precio'); { const f = $('#fPrecio'); if (f) f.value = it.precio; } pintarPrecioItem(); break;
    case 'reintentar-ia': if (it && it.blob) { it.ia = 'pendiente'; procesarIA(); } break;
    case 'guardar-item': guardarItem(); break;
    case 'quitar-item': quitarItem(); break;
    case 'imprimir-guardadas': if (hojaCtx && hojaCtx.guardadas) abrirEtiquetas(hojaCtx.guardadas, 'Etiquetas de las prendas nuevas'); break;
    // vender
    case 'escanear': abrirEscaner(); break;
    case 'cerrar-escaner': cerrarEscaner(); break;
    case 'al-carrito': { const p = buscar(id); if (agregarAlCarrito(p) === true) { const q = $('#qVenta'); if (q) { q.value = ''; renderResultadosVenta(); } } break; }
    case 'vender-prenda': { const p = buscar(id); cerrarHoja(); if (agregarAlCarrito(p) !== 'vendida') ir('vender'); break; }
    case 'quitar-carrito': carrito = carrito.filter(x => x.id !== id); guardarCarritoLocal(); pintarCarrito(true); break;
    case 'carrito-delta': {
      const x = carrito.find(c => c.id === id); if (!x) break;
      x.precio = Math.max(0, (x.precio || 0) + Number(valor)); guardarCarritoLocal();
      const inp = $(`[data-carrito-precio="${CSS.escape(id)}"]`); if (inp) inp.value = x.precio;
      pintarTotalesCarrito(); break;
    }
    case 'vaciar-carrito': carrito = []; guardarCarritoLocal(); pintarCarrito(true); break;
    case 'guardar-venta': guardarVenta(el); break;
    case 'deshacer-venta': deshacerVenta(id); break;
    // prendas
    case 'etiqueta-una': { const p = buscar(id); if (p) abrirEtiquetas([p], 'Etiqueta de la prenda'); break; }
    case 'imprimir-pendientes': abrirEtiquetas(disponibles().filter(p => !p.impresa).sort((a, b) => a.creada - b.creada), 'Etiquetas sin imprimir'); break;
    case 'pdf-etiquetas': {
      const ctx = hojaCtx;
      if (!ctx || !ctx.canvases) { toast('Espere un momento, se están preparando las etiquetas.'); break; }
      el.disabled = true; await pdfEtiquetas(ctx.canvases); el.disabled = false; break;
    }
    case 'imprimir-bt': if (hojaCtx && hojaCtx.lista) { el.disabled = true; await imprimirBluetooth(hojaCtx.lista, el); el.disabled = false; } break;
    case 'imprimir-directo': {
      const ctx = hojaCtx;
      if (!ctx || !ctx.canvases) { toast('Espere un momento, se están preparando las etiquetas.'); break; }
      imprimirDirecto(ctx.canvases); break;
    }
    case 'marcar-impresas': if (hojaCtx && hojaCtx.lista) { el.disabled = true; await marcarImpresas(hojaCtx.lista); } break;
    case 'editar-prenda': abrirEditar(id); break;
    case 'guardar-edicion': guardarEdicion(id, el); break;
    case 'elegir-cliente': abrirClientes(true); break;
    case 'cliente-nuevo': abrirFormCliente(null, hojaCtx && hojaCtx.paraVenta); break;
    case 'cliente-ninguno': cerrarHoja(); ponerClienteVenta(''); break;
    case 'cliente-a-venta': { const x = clientePorTel(id); cerrarHoja(); ponerClienteVenta(id); if (x) toast(`Venta para ${x.nombre}.`, 'bien'); break; }
    case 'ver-cliente': abrirCliente(id); break;
    case 'orden-clientes': filtroClientes.orden = valor; pintarVistaClientes(); break;
    case 'importar-contactos': importarContactos(); break;
    case 'compartir-catalogo': compartirCatalogo(); break;
    case 'contacto-a-form': contactoAlFormulario(); break;
    case 'contacto-a-venta': contactoAVenta(); break;
    case 'tel-contacto': { const f = $('#cTel'); if (f) f.value = telBonito(valor); $$('.tels-contacto .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.valor === valor))); break; }
    case 'editar-cliente': { const x = clientePorTel(id); if (x) abrirFormCliente(x, false); break; }
    case 'guardar-cliente': guardarCliente(el); break;
    case 'borrar-cliente': {
      const x = clientePorTel(id); if (!x) break;
      const n = comprasDeCliente(id).length;
      confirmar(`¿Borrar a ${esc(x.nombre)}?`, `${n === 1 ? 'La prenda que compró se queda como vendida, pero sin cliente. ' : n ? `Las ${n} prendas que compró se quedan como vendidas, pero sin cliente. ` : ''}Esto no se puede deshacer.`, 'Sí, borrar cliente', async () => {

      });

    }
    case 'borrar-prenda':
      confirmar('¿Borrar esta prenda?', 'Se borra de la tienda y de las cuentas. Esto no se puede deshacer.', 'Sí, borrar prenda', async () => {
        if (await escribir(() => backend.quitarPrenda(id))) { cerrarHoja(); toast('Prenda borrada.'); }
      });
      break;
    case 'ver-viejas': Object.assign(filtro, { estado: 'disponible', viejas: true, tipo: '', origen: '', q: '', genero: '', color: '', pmin: 0, pmax: 0, mostrar: 60 }); ir('prendas'); break;
    case 'alternar-viejas': filtro.viejas = !filtro.viejas; if (filtro.viejas) filtro.estado = 'disponible'; filtro.mostrar = 60; VISTAS.prendas.update(); break;
    case 'ver-mas': filtro.mostrar += 60; pintarListaPrendas(); break;
    // hoy
    case 'periodo-modo': periodo.modo = valor; periodo.offset = 0; repintarPeriodo(); break;
    case 'periodo-mover': periodo.offset = Math.min(0, periodo.offset + Number(valor)); repintarPeriodo(); break;
    case 'periodo-hoy': periodo.offset = 0; repintarPeriodo(); break;
    // ajustes
    case 'guardar-ajustes': guardarAjustes(el); break;
    case 'etiqueta-prueba': abrirEtiquetas([{ id: '', codigo: '000000', tipo: 'Blusa', descripcion: 'Etiqueta de prueba', talla: 'M', precio: 2900, estado: 'prueba' }], 'Etiqueta de prueba'); break;
    case 'exportar': exportar(); break;
    case 'respaldo': respaldo(); break;
    case 'salir': if (sbCliente) { await sbCliente.auth.signOut(); location.reload(); } break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  const it = itemActual();
  if (t.id === 'qCliente') pintarListaClientes();
  else if (t.id === 'qClientes') { filtroClientes.q = t.value; pintarVistaClientes(); }
  else if (t.id === 'fPrecio' && it) { it.precio = num(t.value); it.tocado.add('precio'); pintarPrecioItem(); }
  else if (t.id === 'fCostoItem' && it) { it.costoManual = num(t.value); pintarPrecioItem(); }
  else if (t.id === 'fTallaOtra' && it) { it.talla = t.value.trim(); it.tocado.add('talla'); $$('#tallaOpciones .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.valor === it.talla))); programarVista(); }
  else if (t.id === 'fDesc' && it) { it.descripcion = t.value; if (t.value.trim()) it.tocado.add('desc'); else it.tocado.delete('desc'); programarVista(); }
  else if (t.dataset && t.dataset.carritoPrecio) { const x = carrito.find(c => c.id === t.dataset.carritoPrecio); if (x) { x.precio = num(t.value); guardarCarritoLocal(); pintarTotalesCarrito(); } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-fotos]')) { const f = Array.from(t.files || []); t.value = ''; if (t.closest('#camara')) cerrarCamara(); agregarFotos(f); }
  else if (t.id === 'inEscFoto') { const f = t.files && t.files[0]; t.value = ''; escanearFoto(f); }
  else if (t.id === 'inRespaldo') { const f = t.files && t.files[0]; t.value = ''; cargarRespaldo(f); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#escaner').hidden) cerrarEscaner();
  else if (!$('#camara').hidden) cerrarCamara();
  else if (!$('#hoja').hidden) cerrarHoja();
});

/* ================= ARRANQUE ================= */
async function init() {
  $('#logo').innerHTML = ICON.etiqueta;
  $('#btnAjustes').innerHTML = `${ICON.ajustes}<span>Ajustes</span>`;
  $('#btnCerrar').innerHTML = `${ICON.x}<span>Cerrar</span>`;
  $('#btnCerrarEsc').innerHTML = `${ICON.x}<span>Cerrar</span>`;
  $('#escFotoIco').innerHTML = ICON.camara;
  $('#btnCerrarCam').innerHTML = `${ICON.x}<span>Cerrar</span>`;
  $('#camFotoIco').innerHTML = ICON.camara;
  $('#btnDisparar').innerHTML = `${ICON.camara}<span>Tomar foto</span>`;
  $('#tabs').innerHTML = TABS.map(t => `<button type="button" class="tab" data-ir="${t.id}" aria-current="false">${ICON[t.ico]}<span>${t.txt}</span></button>`).join('');
  pintarBotonTema();
  ir('hoy');
  const cfg = window.MI_TIENDA_CONFIG;
  if (cfg && cfg.supabaseUrl && cfg.supabaseAnonKey) { await iniciarSupabase(cfg); return; }
  const [db, user, sample, downloads] = await Promise.all([usar('db'), usar('user'), usar('sample'), usar('downloads')]);
  cap.sample = sample; cap.downloads = downloads;
  if (sample) { try { const lim = await sample.limits(); cap.sampleImagenes = !!(lim && lim.images); } catch (e) { cap.sampleImagenes = false; } }
  if (db && user) { try { if ((await user.can('data.write')) === false) S.soloLectura = true; } catch (e) { /* sin dato */ } }
  backend = db ? new NubeBackend(db) : new LocalBackend();
  S.modo = db ? 'nube' : 'local';
  pintarAvisoModo();
  backend.start();
}
init();
</script>
